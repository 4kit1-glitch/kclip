[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "clipk"
dynamic = ["version"]
description = "Clipboard manager and history utility"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [
  { name = "Kengah Ireneaus", email = "4jrkit1@gmail.com" },
]
keywords = ["clipboard", "utility", "productivity"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Office/Business :: Office Suites",
  "Topic :: Utilities",
]
dependencies = [
  "pyperclip>=1.9.0",
  "pillow>=10.0.0",
  "requests>=2.31.0",
  "rich>=13.0.0",
]

[project.urls]
Homepage = "https://github.com/4kit1-glitch/clipk"
Repository = "https://github.com/4kit1-glitch/clipk"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["clipk*"]

[tool.setuptools.dynamic]
version = { attr = "clipk.__about__.__version__" }

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "RUF"]
ignore = ["I001", "RUF022"]
